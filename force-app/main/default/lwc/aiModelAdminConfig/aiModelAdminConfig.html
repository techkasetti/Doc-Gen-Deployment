<template>

    <!-- Header -->
    <div class="slds-box slds-m-bottom_large">
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1">
                <div class="slds-text-heading_medium slds-m-bottom_x-small">
                    AI Model Configuration
                </div>

                <div class="slds-text-body_small slds-text-color_weak">
                    Configure available AI models for document generation
                </div>
            </div>
        </div>
    </div>

    <!-- AI Models Table -->
    <lightning-datatable
        key-field="id"
        data={aiModels}
        columns={columns}
        hide-checkbox-column="true"
        onrowaction={handleRowAction}
        sorted-by={sortedBy}
        sorted-direction={sortDirection}
        onsort={handleSort}>
    </lightning-datatable>

    <!-- Test Model Connection Section -->
    <div class="slds-section slds-is-open slds-m-top_large">
        <h3 class="slds-section__title">
            <span class="slds-truncate">Test Model Connection</span>
        </h3>

        <div class="slds-section__content">
            <div class="slds-grid slds-gutters">

                <!-- Model Picklist -->
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox
                        name="testModel"
                        label="Select Model to Test"
                        value={selectedTestModel}
                        options={modelTestOptions}
                        onchange={handleTestModelChange}>
                    </lightning-combobox>
                </div>

                <!-- Prompt Input -->
                <div class="slds-col slds-size_1-of-2">
                    <lightning-textarea
                        name="testPrompt"
                        label="Test Prompt"
                        value={testPrompt}
                        onchange={handleTestPromptChange}>
                    </lightning-textarea>
                </div>

            </div>
        </div>
    </div>

</template>
