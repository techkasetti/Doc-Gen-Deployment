<template>

    <!-- Custom Buttons -->
    <div class="button-container">

        <lightning-button 
            label="Template Manager"
            variant={templateManagerVariant}
            onclick={showTemplateManagerSection}>
        </lightning-button>

        <lightning-button 
            label="Document Generator"
            variant={generatorVariant}
            onclick={showGeneratorSection}>
        </lightning-button>

        <lightning-button 
            label="Document Viewer"
            variant={viewerVariant}
            onclick={showViewerSection}>
        </lightning-button>

        <lightning-button 
            label="Signature Pad"
            variant={signatureVariant}
            onclick={showSignatureSection}>
        </lightning-button>

    </div>

    <br/>

    <!-- Show Components -->

    <template if:true={showTemplateManager}>
        <lightning-card title="Template Manager">
            <c-template-manager></c-template-manager>
        </lightning-card>
    </template>

    <template if:true={showGenerator}>
        <lightning-card title="Document Generator">
            <c-document-generator></c-document-generator>
        </lightning-card>
    </template>

    <template if:true={showViewer}>
        <lightning-card title="Document Viewer">
            <c-document-viewer></c-document-viewer>
        </lightning-card>
    </template>

    <template if:true={showSignature}>
        <lightning-card title="Signature Pad">
            <c-signature-pad></c-signature-pad>
        </lightning-card>
    </template>

</template>
